name: Monitor production

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekflow-production-monitor
  cancel-in-progress: true

jobs:
  health:
    name: Verify public application, D1 and login
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify production contracts
        run: node scripts/verify-production-health.mjs
