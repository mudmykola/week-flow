name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run merge and deployment quality gate
        run: pnpm quality:gate

      - name: Install E2E browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated Worker and D1 E2E
        run: pnpm test:e2e

      - name: Validate Cloudflare API token format
        run: pnpm cloudflare:token:check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production Cloudflare access
        run: pnpm exec wrangler d1 migrations list weekflow-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Capture pre-migration recovery bookmark
        run: |
          mkdir -p deployment-metadata
          pnpm exec wrangler d1 time-travel info weekflow-db --json --config wrangler.toml > deployment-metadata/d1-recovery.json
          node -e "const fs=require('node:fs');const p='deployment-metadata/release.json';fs.writeFileSync(p,JSON.stringify({repository:process.env.GITHUB_REPOSITORY,sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,capturedAt:new Date().toISOString()},null,2))"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Retain recovery metadata
        uses: actions/upload-artifact@v6
        with:
          name: production-recovery-${{ github.run_id }}
          path: deployment-metadata
          retention-days: 30

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          wranglerVersion: 4.118.0
          command: d1 migrations apply weekflow-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          wranglerVersion: 4.118.0
          command: deploy

      - name: Verify production endpoint
        run: curl --fail --silent --show-error --retry 6 --retry-delay 10 https://weekflow.pp.ua/ > /dev/null

      - name: Verify production API and D1
        run: node scripts/verify-production-health.mjs
